apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jwt-ingress
  annotations:
    nginx.com/policies: "jwt-policy-invalid"
spec:
  ingressClassName: nginx
  rules:
  - host: ingress-jwt.example.com
    http:
      paths:
      - path: /backend1
        pathType: Prefix
        backend:
          service:
            name: backend1-svc
            port:
              number: 80
      - path: /backend2
        pathType: Prefix
        backend:
          service:
            name: backend2-svc
            port:
              number: 80
