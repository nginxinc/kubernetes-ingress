apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jwt-ingress-master
  annotations:
    nginx.org/mergeable-ingress-type: "master"
    nginx.com/policies: "jwt-policy-valid-multi"
spec:
  ingressClassName: nginx
  rules:
  - host: ingress-jwt.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jwt-ingress-minion
  annotations:
    nginx.org/mergeable-ingress-type: "minion"
    nginx.com/policies: "jwt-policy-valid"
spec:
  ingressClassName: nginx
  rules:
  - host: ingress-jwt.example.com
    http:
      paths:
      - path: /backend1
        pathType: Prefix
        backend:
          service:
            name: backend1-svc
            port:
              number: 80
